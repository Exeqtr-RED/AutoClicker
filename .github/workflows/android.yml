# ФИЧА: автоматическая сборка APK на каждый push + выкладка в Releases по тегам.
#
# Как этим пользоваться:
#  - Любой push в main (и PR) -> workflows собирают APK, их можно скачать
#    на вкладке Actions запуска (Artifacts -> SekiraCliker-apks):
#      * "Sekira Cliker.apk"  — release (R8-минификация, подписан отладочным
#        ключом — ставится и обновляется как обычное приложение)
#      * SekiraCliker-debug.apk — debug (медленнее, крупнее)
#  - Чтобы опубликовать релиз: git tag v1.1 && git push origin v1.1 ->
#    workflow создаст GitHub Release с "Sekira Cliker.apk" внутри.
#
# Примечание (Task 26): release подписывается отладочным ключом
# (signingConfig = debug в app/build.gradle.kts, keystore генерируется
# автоматически) — раньше APK был unsigned и не устанавливался.
# ВНИМАНИЕ: ключ на CI отличается от ключа на твоём компьютере, поэтому
# APK из Actions может не встать поверх локально собранного — сначала удали
# приложение (пресеты при этом сотрутся).

name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ФИКС: SDK предустановлен на ubuntu-latest, AGP сам докачает недостающие
      # платформы/build-tools. Экшен android-actions/setup-android@v3 убран:
      # после принятия лицензий он пытается установить устаревший пакет "tools",
      # удалённый Google из репозитория SDK, и падает
      # ("Failed to find package 'tools'" -> exit code 1).
      # Оставляем только принятие лицензий штатным sdkmanager раннера.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
        # assembleRelease сам кладёт подписанный release-APK в dist/ с именем
        # "Sekira Cliker.apk" (см. задачу-копию в app/build.gradle.kts)

      # ФИЧА (Task 26): плоская структура артефакта с понятными именами
      - name: Collect APKs
        run: |
          mkdir -p apks_out
          cp "dist/Sekira Cliker.apk" apks_out/
          cp app/build/outputs/apk/debug/app-debug.apk apks_out/SekiraCliker-debug.apk
          ls -la apks_out

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SekiraCliker-apks
          path: apks_out/*

      # mapping.txt нужен, чтобы деобфусцировать стек-трейсы release-сборки
      # (включена R8-минификация, см. app/build.gradle.kts)
      - name: Upload R8 mapping (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SekiraCliker-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  release:
    # Публикуем в Releases только по тегам вида v1.0, v2.3.1, ...
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: SekiraCliker-apks
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "apks/Sekira Cliker.apk"
          generate_release_notes: true
