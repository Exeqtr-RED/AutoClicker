# ФИЧА: автоматическая сборка APK на каждый push + выкладка в Releases по тегам.
#
# Как этим пользоваться:
#  - Любой push в main (и PR) -> workflows собирают APK, их можно скачать
#    на вкладке Actions запуска (Artifacts -> Sekira Cliker APK):
#      * "Sekira Cliker.apk"  — release (R8-минификация, подписан
#        фиксированным ключом — ставится и обновляется как обычное приложение)
#      * "Sekira Cliker debug.apk" — debug (медленнее, крупнее)
#  - Чтобы опубликовать релиз: git tag v1.1 && git push origin v1.1 ->
#    workflow создаст GitHub Release с "Sekira Cliker.apk" внутри.
#
# ФИКС (v20) в именах: раньше артефакты назывались слитно, без пробела —
# выглядело как "Sekira.Cliker". Теперь все
# имена — только через пробел: "Sekira Cliker APK", "Sekira Cliker mapping",
# "Sekira Cliker.apk", "Sekira Cliker debug.apk". Плюс страховочное
# копирование: если задача copyReleaseApk не отработала, APK берётся
# напрямую из app/build/outputs/apk/release/
#
# Примечание (v19): release и debug подписываются ФИКСИРОВАННЫМ ключом
# из репозитория (keystore/sekira.keystore, signingConfigs "sekira" в
# app/build.gradle.kts) — раньше APK был unsigned, потом подписывался
# отладочным ключом, который У КАЖДОЙ машины СВОЙ, из-за чего APK из
# Actions не вставал поверх локально собранного. Теперь подпись везде
# одинаковая: обновления ставятся поверх без удаления.
# ВНИМАНИЕ (одноразово): версия, установленная ДО v19, подписана старым
# ключом — первый апдейт на v19 требует удаления старой версии (пресеты
# при этом сотрутся — пересохраните их параметры).

name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ФИКС: SDK предустановлен на ubuntu-latest, AGP сам докачает недостающие
      # платформы/build-tools. Экшен android-actions/setup-android@v3 убран:
      # после принятия лицензий он пытается установить устаревший пакет "tools",
      # удалённый Google из репозитория SDK, и падает
      # ("Failed to find package 'tools'" -> exit code 1).
      # Оставляем только принятие лицензий штатным sdkmanager раннера.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
        # assembleRelease сам кладёт подписанный release-APK в dist/ с именем
        # "Sekira Cliker.apk" (см. задачу-копию в app/build.gradle.kts)

      # ФИЧА (Task 26): плоская структура артефакта с понятными именами
      # ФИКС (v20): страховка — если copyReleaseApk не дал dist-файл,
      # берём release-APK напрямую из outputs (имя результата то же)
      - name: Collect APKs
        run: |
          mkdir -p apks_out
          if [ -f "dist/Sekira Cliker.apk" ]; then
            cp "dist/Sekira Cliker.apk" apks_out/
          else
            cp app/build/outputs/apk/release/app-release.apk "apks_out/Sekira Cliker.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "apks_out/Sekira Cliker debug.apk"
          ls -la apks_out

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Sekira Cliker APK
          path: apks_out/*

      # mapping.txt нужен, чтобы деобфусцировать стек-трейсы release-сборки
      # (включена R8-минификация, см. app/build.gradle.kts)
      - name: Upload R8 mapping (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Sekira Cliker mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  release:
    # Публикуем в Releases только по тегам вида v1.0, v2.3.1, ...
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: Sekira Cliker APK
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "apks/Sekira Cliker.apk"
          generate_release_notes: true
